<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Steps Section — Final (Our 4-Step Process)</title>
<style>
  /* ============================================================
     Final steps-section study: same arrow anatomy as the reference,
     content = our 4-step onboarding process (from site.ts),
     colors derived ONLY from design/tokens.css via color-mix,
     panel = bordered + rounded like the rest of the design system.
     ============================================================ */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Roboto', 'Segoe UI', Arial, sans-serif;
    background: var(--color-surface, #F8F8F6);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
    padding: 48px 24px;
  }

  :root {
    --color-primary: #00203C;   /* token reference values for standalone viewing */
    --color-secondary: #009966;
    --color-surface: #F8F8F6;
    --color-text-2: #3D5068;
    --color-grey-3: #DEDEDE;
    --font-family: 'Roboto', sans-serif;
  }

  .panel {
    background: #fff;
    border: 1px solid var(--color-grey-3);
    border-radius: 32px;
    padding: 56px 48px 64px;
    width: 1040px;
    max-width: 100%;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 24px;
  }

  .col { position: relative; display: flex; flex-direction: column; }

  .col::before {
    content: '';
    position: absolute;
    left: 0;
    top: 46px;
    height: calc(100% - 46px);
    width: 10px;
    background: var(--color-primary);
    opacity: .12;
    filter: blur(12px);
    border-radius: 8px;
    z-index: 0;
  }

  .num {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: .02em;
    line-height: 1;
    margin-bottom: 10px;
    font-family: 'Montserrat', 'Roboto', sans-serif;
    position: relative;
    z-index: 1;
  }

  .arrow {
    position: relative;
    height: 54px;
    width: 100%;
    clip-path: polygon(0 0, calc(100% - 30px) 0, 100% 50%, calc(100% - 30px) 100%, 0 100%);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    z-index: 1;
  }

  .arrow svg { width: 20px; height: 20px; margin-right: 52px; color: #fff; }

  .title {
    margin-top: 18px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .04em;
    text-transform: uppercase;
    color: var(--color-primary);
    font-family: 'Montserrat', 'Roboto', sans-serif;
    position: relative;
    z-index: 1;
  }

  .body {
    margin-top: 8px;
    font-size: 13px;
    line-height: 1.6;
    color: var(--color-text-2);
    max-width: 210px;
    position: relative;
    z-index: 1;
  }

  /* Navy ramp derived from --color-primary + --color-surface (light -> dark like the reference) */
  .f1 { color: color-mix(in srgb, var(--color-primary) 72%, var(--color-surface)); background-color: color-mix(in srgb, var(--color-primary) 40%, var(--color-surface)); }
  .f2 { color: color-mix(in srgb, var(--color-primary) 84%, var(--color-surface)); background-color: color-mix(in srgb, var(--color-primary) 62%, var(--color-surface)); }
  .f3 { color: color-mix(in srgb, var(--color-primary) 96%, var(--color-surface)); background-color: color-mix(in srgb, var(--color-primary) 84%, var(--color-surface)); }
  .f4 { color: var(--color-primary); background-color: var(--color-primary); }
</style>
</head>
<body>
  <div class="panel">
    <div class="row" id="steps-row"></div>
  </div>

  <script>
    // OUR 4-step process — exact copy from src/content/site.ts
    const steps = [
      { n: '01', c: 'f1', icon: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>',
        title: 'Contact Us', body: 'Submit our brief inquiry form or call our operations desk to introduce your team and core requirements.' },
      { n: '02', c: 'f2', icon: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
        title: 'Discovery Call', body: 'We hold a 30-minute scoping session to analyze support channels, peak volumes, tooling, and team requirements.' },
      { n: '03', c: 'f3', icon: '<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M9 13h6"/><path d="M9 17h4"/>',
        title: 'Tailored Proposal', body: 'We provide an itemized operational proposal with bespoke staffing models, SLA commitments, and transparent quotes.' },
      { n: '04', c: 'f4', icon: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>',
        title: 'Launch & Support', body: 'Your fully vetted, trained team goes live under dedicated management with continuous daily performance audits.' },
    ];

    document.getElementById('steps-row').innerHTML = steps.map(d => `
      <div class="col">
        <span class="num ${d.c}">${d.n}</span>
        <div class="arrow ${d.c}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${d.icon}</svg>
        </div>
        <h3 class="title">${d.title}</h3>
        <p class="body">${d.body}</p>
      </div>
    `).join('');
  </script>
</body>
</html>
